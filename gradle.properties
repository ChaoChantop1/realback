org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Only keep the R class for fields from the current library.
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# Release identity — the single source of truth for the APK's version.
# The release CI job fails the build when the pushed git tag disagrees with
# realback.versionName, so a tag can no longer ship an APK reporting another
# version (that is how v0.1.1 ended up shipping as 0.1.0).
# Bump BOTH per release: versionCode must strictly increase or an installed
# app cannot update in place.
realback.versionName=0.1.2
realback.versionCode=2
