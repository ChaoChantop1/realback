name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # No wrapper committed yet: use a pinned Gradle version.
          gradle-version: "8.10.2"

      - name: Run core unit tests
        run: |
          set -o pipefail
          gradle :core:test --console=plain 2>&1 | tee build.log

      - name: Annotate errors
        if: failure()
        run: |
          grep -E '^e:|error:|FAILED|Execution failed|Caused by|^FAILURE' build.log | head -40 \
            | cut -c1-220 | sed 's/%/%25/g; s/^/::error::/'

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app-android:assembleDebug --console=plain 2>&1 | tee build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: realback-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk
          # Default is "warn": a green job with no deliverable. The acceptance
          # criterion for this repo is the APK existing, so make its absence
          # fail the run instead of passing silently.
          if-no-files-found: error

      - name: Annotate errors
        if: failure()
        run: |
          grep -E '^e:|error:|FAILED|Execution failed|Caused by|^FAILURE' build.log | head -40 \
            | cut -c1-220 | sed 's/%/%25/g; s/^/::error::/'

  release-build:
    name: Release APK (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # gradle.properties is the single source of truth for the APK version, so
      # the tag decides nothing about what ships. Without this gate a tag can be
      # cut without bumping the declared version — which is exactly how v0.1.1
      # published an APK that self-reported 0.1.0.
      - name: Verify tag matches the declared version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          DECLARED=$(grep -m1 '^realback.versionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$TAG" != "$DECLARED" ]; then
            echo "::error::tag v$TAG does not match realback.versionName=$DECLARED in gradle.properties — bump the version before releasing"
            exit 1
          fi
          echo "Release identity verified: $TAG"

      # Debug-signed release APK (see build.gradle.kts note) — installable,
      # must be replaced with a real keystore before any store distribution.
      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app-android:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: realback-release-apk
          path: app-android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-android/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Annotate errors
        if: failure()
        run: |
          grep -E '^e:|error:|FAILED|Execution failed|Caused by|^FAILURE' build.log | head -40 \
            | cut -c1-220 | sed 's/%/%25/g; s/^/::error::/'
