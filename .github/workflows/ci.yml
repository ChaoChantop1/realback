name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # No wrapper committed yet: use a pinned Gradle version.
          gradle-version: "8.10.2"

      - name: Run core unit tests
        run: gradle :core:test --console=plain 2>&1 | tee build.log

      - name: Annotate errors
        if: failure()
        run: |
          grep -E '^e:|error:|FAILED|Execution failed|Caused by|^FAILURE' build.log | head -40 \
            | cut -c1-220 | sed 's/%/%25/g; s/^/::error::/'

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app-android:assembleDebug --console=plain 2>&1 | tee build.log

      - name: Annotate errors
        if: failure()
        run: |
          grep -E '^e:|error:|FAILED|Execution failed|Caused by|^FAILURE' build.log | head -40 \
            | cut -c1-220 | sed 's/%/%25/g; s/^/::error::/'
